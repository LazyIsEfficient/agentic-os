[package]
name = "v2-runtime"
version = "0.1.0"
edition = "2021"
description = "v2 multi-agent collaboration runtime: a Rust orchestrator that owns the Redis blackboard and clocks the round loop, spawning each agent turn via `claude -p`."
publish = false

# Lib + bin crate. `src/lib.rs` is the library (this task).
# `src/main.rs` (the thin CLI bin) is added by a LATER task (T-driver) and
# auto-registers as the crate's default bin target — no Cargo.toml edit needed.
[lib]
name = "v2_runtime"
path = "src/lib.rs"

[dependencies]
# Sync Redis client for the blackboard. `streams` feature enables the STREAM
# (XADD/XRANGE) API used by the append-only `log` blackboard key.
redis = { version = "1.2.3", features = ["streams"] }
# Contribution / participant schema (de)serialization.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Error handling for the binary/orchestrator boundary (anyhow::Result at I/O edges).
anyhow = "1.0.102"
# Arg parsing for the CLI bin added in T-driver (`run --task`, `inspect <run>`).
clap = { version = "4.6.1", features = ["derive"] }
